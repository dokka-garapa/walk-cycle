<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>歩きの中割りゲーム</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:#111722;color:#f4f6f8;font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:760px;padding:8px 12px 12px;display:flex;flex-direction:column;gap:6px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-size:22px;margin:0;font-weight:800}
.top span{color:#aab4c0;font-size:13px}
.lead{margin:0;font-size:13px;line-height:1.5;color:#e6e9ee}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.th{cursor:pointer;text-align:center;font-size:15px;font-weight:700;padding-bottom:2px}
.th .tl{margin-bottom:3px}
.th canvas{display:block;width:100%;height:auto;background:#fff;border:3px solid transparent;box-sizing:border-box}
.th.cur{color:#ff3b3b}
.th.cur canvas{border-color:#ff1f1f}
.paper{background:#fff;border:1px solid #cfd6dd;border-radius:6px;overflow:hidden}
canvas#cv{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
.msg{min-height:26px;font-size:14px;line-height:1.7}
.msg b{font-size:22px}
.gl{color:#9be000;font-weight:700}
.key i{display:inline-block;width:11px;height:11px;border-radius:50%;margin:0 4px 0 12px;vertical-align:-1px}
.warn{color:#ffb25a}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row[hidden],button[hidden]{display:none}
button{flex:1;min-width:0;padding:7px 6px;font:inherit;font-size:14px;font-weight:600;color:#fff;background:#111722;border:2px solid #b9aeb9;border-radius:3px}
button:focus-visible{outline:2px solid #6ea8ff;outline-offset:2px}
#gd.on{color:#9be000}
button.go{background:#fff;color:#111722;border-color:#fff;font-size:16px}
.tr button{min-height:42px}
.tr #pv,.tr #nv{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;line-height:1.15;font-size:12px}
.tr .ar{font-size:22px;font-weight:300}
.pp{flex:1.2;display:flex;flex-direction:column;gap:4px}
.pp button{width:100%;flex:1;min-height:0;padding:4px;font-size:12px}
.pp.single button{min-height:42px;font-size:18px}
</style></head><body>
<main>
<div class="top"><h1>歩きの中割りゲーム</h1><span id="step"></span></div>
<p class="lead">関節（膝・足首・つま先）を動かして中割りポーズを取らせてください。</p>
<div class="strip" id="strip"></div>
<div class="paper"><canvas id="cv"></canvas></div>
<div class="msg" id="msg"></div>
<div class="row" id="rGo" hidden><button class="go" id="go">完成とする</button></div>
<div class="row" id="r1"><button id="gd" class="on">ガイド:ON</button><button id="nxs">次の中割りへ</button></div>
<div class="row" id="rF" hidden><button id="sr">見本参考を隠す</button><button id="rdo">描き直す</button></div>
<div class="row tr">
<button id="pv"><span class="ar">＜</span><span>1枚<br>戻る</span></button>
<div class="pp single" id="pp"><button id="bp">▶ 再生</button><button id="bi" hidden>▶ 見本参考を再生</button></div>
<button id="nv"><span>1枚<br>進む</span><span class="ar">＞</span></button>
</div>
<div class="row"><button id="clr">この中割りをリセット</button><button id="gif" hidden>GIFアニメで保存</button><button id="ba">最初から</button></div>
<div id="gp" hidden><img id="gpi" alt="作成したGIFアニメ" style="display:block;width:100%;border-radius:4px;background:#fff"></div>
</main>
<script>
const W=720,H=520,G=450,L1=96,L2=96,FT=34,TL=135,AU=74,AL=66,HX=330;
const $=i=>document.getElementById(i),cv=$('cv'),cx=cv.getContext('2d');
cv.width=W;cv.height=H;
const lerp=(a,b,t)=>Array.isArray(a)?a.map((v,i)=>lerp(v,b[i],t)):typeof a==='object'?Object.fromEntries(Object.keys(a).map(k=>[k,lerp(a[k],b[k],t)])):a+(b-a)*t;
// 脚[太もも,すね,足] 腕[上腕,前腕] 角度は真下から進行方向へ+（描画時に左向きへ反転）
const K1={R:[30,30,-12],L:[-24,-55,45],aR:[-28,-12],aL:[26,52],lean:4};
const P1={R:[6,-4,0],L:[24,-34,30],aR:[-6,18],aL:[6,26],lean:5};
const sw=p=>({R:p.L,L:p.R,aR:p.aL,aL:p.aR,lean:p.lean});
const K2=sw(K1),P2=sw(P1),KEY={k1:K1,k2:K2};
// フレーム f=0〜7 ＝ 動画①,2,3,4,⑤,6,7,8。中割りの添字 j=0〜5 ＝ 動画2,3,4,6,7,8
// 見本参考の調整：遊脚の足首を少し上げる（動画4・8はさらに少し前＝左へ）。右足=奥の脚(L)、左足=手前の脚(R)
function raiseAnkle(p,leg,dx,dy){const D=Math.PI/180,a=p[leg][0]*D,b=p[leg][1]*D;
 const ax=L1*Math.sin(a)+L2*Math.sin(b)+dx,ay=L1*Math.cos(a)+L2*Math.cos(b)-dy;
 const d=Math.min(Math.hypot(ax,ay),L1+L2-.5),ang=Math.atan2(ax,ay),ux=Math.sin(ang),uy=Math.cos(ang),h=Math.sqrt(Math.max(L1*L1-d*d/4,0));
 const kx=ux*d/2+uy*h,ky=uy*d/2-ux*h,nx=ux*d,ny=uy*d;
 return{...p,[leg]:[Math.atan2(kx,ky)/D,Math.atan2(nx-kx,ny-ky)/D,p[leg][2]]}}
// 動画2〜4の見本参考：送ってもらったイラスト（3枚）から読み取ったポーズ。動画6〜8は左右を入れ替えた同じポーズ
// R=手前の脚(左足)、L=奥の脚(右足)、aR=手前の腕、aL=奥の腕。角度は真下(腕は真下)から進行方向へ+
const IDEAL0=[
 {R:[18,4,0],L:[-4,-73,76],aR:[-16,6],aL:[28,38],lean:4.5},
 {R:[0,-2,0],L:[20,-55,35],aR:[-4.5,17],aL:[17,20],lean:5},
 {R:[-6,-36,23],L:[40,2,-8],aR:[12,35],aL:[-5,-10],lean:5}];
const IDEAL=IDEAL0.concat(IDEAL0.map(sw));
const NUM=[2,3,4,6,7,8],NAMES=['①','2','3','4','⑤','6','7','8'],SV=[null,0,1,2,null,3,4,5],FI=[1,2,3,5,6,7];
const FNAME=f=>f==0?'原画①(動画①)':f==4?'原画②(動画⑤)':'動画'+NAMES[f];
const SEQ=[1,0,2,4,3,5]; // おすすめの順：動画3→2→4（ターム1）、動画7→6→8（ターム2）
const GUIDE={1:['k1','k2'],0:['k1',1],2:[1,'k2'],4:['k2','k1',1],3:['k2',4,0],5:[4,'k1',2]};
const GC={k1:'#2f6fdb',k2:'#2e9e4f'};
const gcol=(g,j)=>GC[g]||(j>=3&&g<3?'#ff5c5c':['#b8860b','#0e9aa7','#777'][g%3]);
const gname=g=>g=='k1'?'原画①(動画①)':g=='k2'?'原画②(動画⑤)':'動画'+NUM[g];
const rd=d=>d*Math.PI/180,mir=p=>[2*HX-p[0],p[1]];
function pts(p){
 const leg=a=>{const k=[HX+L1*Math.sin(rd(a[0])),L1*Math.cos(rd(a[0]))];const n=[k[0]+L2*Math.sin(rd(a[1])),k[1]+L2*Math.cos(rd(a[1]))];return{k,n,t:[n[0]+FT*Math.cos(rd(a[2])),n[1]+FT*Math.sin(rd(a[2]))]}};
 const r=leg(p.R),l=leg(p.L);
 const dy=G-Math.max(r.n[1],r.t[1],l.n[1],l.t[1]);
 const m=o=>{for(const k in o)o[k]=[o[k][0],o[k][1]+dy];return o};
 m(r);m(l);
 const hip=[HX,dy],s=Math.sin(rd(p.lean)),c=Math.cos(rd(p.lean));
 const neck=[HX+TL*s,dy-TL*c],sh=[HX+TL*.92*s,dy-TL*.92*c],head=[neck[0]+26*s,neck[1]-28*c];
 const arm=a=>{const e=[sh[0]+AU*Math.sin(rd(a[0])),sh[1]+AU*Math.cos(rd(a[0]))];return[sh,e,[e[0]+AL*Math.sin(rd(a[1])),e[1]+AL*Math.cos(rd(a[1]))]]};
 return{r,l,hip,neck,sh,head,ln:rd(p.lean),aR:arm(p.aR),aL:arm(p.aL)};
}
// ---- 人形の描画 ----
const OUT='#2a2a2e',COLS=['#ff9d9d','#a9e6ff'],GREEN='#b8f548'; // 手前=赤っぽいピンク / 奥=水色 / 頭と体=黄緑
const disc=(c,p,r,col)=>{c.fillStyle=col;c.beginPath();c.arc(p[0],p[1],Math.max(r,0),0,7);c.fill()};
function quad(c,a,b,wa,wb,col){const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy)||1,nx=-dy/d,ny=dx/d;
 c.fillStyle=col;c.beginPath();c.moveTo(a[0]+nx*wa/2,a[1]+ny*wa/2);c.lineTo(b[0]+nx*wb/2,b[1]+ny*wb/2);c.lineTo(b[0]-nx*wb/2,b[1]-ny*wb/2);c.lineTo(a[0]-nx*wa/2,a[1]-ny*wa/2);c.fill();
 disc(c,a,wa/2,col);disc(c,b,wb/2,col)}
function limb(c,segs){for(const s of segs)quad(c,s[0],s[1],s[2]+6,s[3]+6,OUT);for(const s of segs)quad(c,s[0],s[1],s[2],s[3],s[4])}
const legB=(c,hip,l,f)=>{const dx=l.t[0]-l.n[0],dy=l.t[1]-l.n[1],d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
 limb(c,[[hip,l.k,42,30,COLS[f]],[l.k,l.n,30,20,COLS[f]],[[l.n[0]-ux*8,l.n[1]-uy*8],[l.t[0]+ux*6,l.t[1]+uy*6],22,14,COLS[f]]])};
// 頭・首・体の形（参考イラストの寸法。前=+x、上=-y、原点=腰の関節）
const TP=[[28,-118],[32,-98],[30,-43],[28,-13],[20,15],[-20,19],[-28,2],[-18,-33],[-15,-73],[-10,-111],[2,-121]];
const HP=[[22,-205],[42,-197],[49,-181],[50,-163],[47,-149],[40,-139],[26,-134],[10,-135],[0,-145],[-3,-165],[-1,-187],[8,-201]];
function smooth(c,P){const n=P.length,m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2],s=m(P[n-1],P[0]);
 c.beginPath();c.moveTo(s[0],s[1]);for(let i=0;i<n;i++){const e=m(P[i],P[(i+1)%n]);c.quadraticCurveTo(P[i][0],P[i][1],e[0],e[1])}c.closePath()}
function bodyDraw(c,q,part){
 const armB=(a,f)=>limb(c,[[a[0],a[1],24,18,COLS[f]],[a[1],a[2],18,13,COLS[f]],[a[2],a[2],23,23,COLS[f]]]);
 const trunk=()=>{ // 頭・首・体はひとつながりの黄緑のシルエット
  const S=1.1,cl=Math.cos(q.ln),sl=Math.sin(q.ln),L=p=>[q.hip[0]+(p[0]*cl-p[1]*sl)*S,q.hip[1]+(p[0]*sl+p[1]*cl)*S];
  const pass=(e,col)=>{c.fillStyle=col;c.strokeStyle=col;c.lineWidth=e;c.lineJoin='round';
   for(const poly of[TP,HP]){smooth(c,poly.map(L));c.fill();if(e)c.stroke()}
   quad(c,L([15,-118]),L([14,-136]),26+e,24+e,col)};
  pass(6,OUT);pass(0,GREEN)};
 const head=()=>{};
 if(part=='upper'){armB(q.aL,1);trunk();head()}
 else if(part=='nearArm'){armB(q.aR,0)} // 手前の腕（左腕）は足より前に出すため別描き
 else if(part=='lower'){legB(c,q.hip,q.l,1);legB(c,q.hip,q.r,0)}
 else{armB(q.aL,1);legB(c,q.hip,q.l,1);trunk();head();legB(c,q.hip,q.r,0);armB(q.aR,0)}
}
function draw(c,p,o){
 o=Object.assign({part:'all',t:{ox:HX,oy:G,s:1}},o);const q=pts(p),t=o.t;
 c.save();c.translate(t.ox,t.oy);c.scale(-t.s,t.s);c.translate(-HX,-G); // 左向きに反転
 c.lineCap=c.lineJoin='round';bodyDraw(c,q,o.part);c.restore();
}
function paper(c){c.fillStyle='#fff';c.fillRect(0,0,W,H);c.strokeStyle='#b9c2cb';c.lineWidth=2;c.beginPath();c.moveTo(30,G+4);c.lineTo(W-30,G+4);c.stroke()}

// ---- 人形の脚（画面座標。腰は固定、長さは固定。a1=太もも a2=すね a3=足 の角度）----
const hipOf=j=>pts(IDEAL[j]).hip;
const legPts=(hip,s)=>{const k=[hip[0]+L1*Math.sin(s.a1),hip[1]+L1*Math.cos(s.a1)];const n=[k[0]+L2*Math.sin(s.a2),k[1]+L2*Math.cos(s.a2)];return{k,n,t:[n[0]+FT*Math.cos(s.a3),n[1]+FT*Math.sin(s.a3)]}};
const fromModel=a=>({a1:-rd(a[0]),a2:-rd(a[1]),a3:Math.PI-rd(a[2])});
const defaultState=j=>{const K=KEY[j<3?'k1':'k2'];return{r:fromModel(K.R),l:fromModel(K.L)}};
function puppetFrame(c,j,s){const hip=hipOf(j);legB(c,hip,legPts(hip,s.l),1);draw(c,IDEAL[j],{part:'upper'});legB(c,hip,legPts(hip,s.r),0);draw(c,IDEAL[j],{part:'nearArm'})}
const HC={r:'#ff3b3b',l:'#18b3ff'},HRAD={k:14,n:14,t:10}; // r=手前の脚(オレンジ)=左足 / l=奥の脚(紫)=右足
function handles(){const j=jj(),hip=hipOf(j),P=getP(j),a=[];for(const L of['l','r']){const q=legPts(hip,P[L]);for(const k of['t','n','k'])a.push({L,j:k,p:q[k]})}return a}
function drawHandles(){for(const h of handles()){cx.fillStyle=HC[h.L];cx.strokeStyle='#fff';cx.lineWidth=3;cx.beginPath();cx.arc(h.p[0],h.p[1],HRAD[h.j],0,7);cx.fill();cx.stroke()}}

// ガイド用：人形を色付き半透明で重ねる（重なりで濃くならないよう別キャンバスに描いてから合成）
const off=document.createElement('canvas');off.width=W;off.height=H;const ox_=off.getContext('2d');
function guideDoll(fn,col,al){ox_.globalCompositeOperation='source-over';ox_.clearRect(0,0,W,H);fn(ox_);
 ox_.globalCompositeOperation='source-atop';ox_.globalAlpha=.5;ox_.fillStyle=col;ox_.fillRect(0,0,W,H);ox_.globalAlpha=1;
 cx.save();cx.globalAlpha=al;cx.drawImage(off,0,0);cx.restore()}
function drawGuides(j){for(const g of GUIDE[j]){let fn;
 if(g=='k1'||g=='k2')fn=c=>draw(c,KEY[g],{part:'lower'});
 else{const s=saved[g];if(!s)continue;const hip=hipOf(g);fn=c=>{legB(c,hip,legPts(hip,s.l),1);legB(c,hip,legPts(hip,s.r),0)}}
 guideDoll(fn,gcol(g,j),.45)}}
// 軸足バッジ（動画2〜4は左足、6〜8は右足）
function badge(c,j,x,y,sz){const L=j<3?'r':'l',t=`軸足：${j<3?'左足':'右足'}`;c.save();c.font=`bold ${sz}px sans-serif`;
 const w=c.measureText(t).width+sz*1.9;c.fillStyle='#fff';c.strokeStyle=HC[L];c.lineWidth=3;c.beginPath();c.rect(x,y,w,sz*1.7);c.fill();c.stroke();
 c.fillStyle=HC[L];c.beginPath();c.arc(x+sz*.8,y+sz*.85,sz*.4,0,7);c.fill();
 c.fillStyle='#1d2733';c.textBaseline='middle';c.textAlign='left';c.fillText(t,x+sz*1.5,y+sz*.9);c.restore()}
// 右上の「ポーズ見本」枠
function inset(f){const j=SV[f],pose=j==null?KEY[f?'k2':'k1']:IDEAL[j];
 cx.save();cx.fillStyle='#fff';cx.strokeStyle='#f97316';cx.lineWidth=6;cx.fillRect(525,95,165,318);cx.strokeRect(525,95,165,318);
 cx.strokeStyle='#b9c2cb';cx.lineWidth=2;cx.beginPath();cx.moveTo(535,396);cx.lineTo(680,396);cx.stroke();
 cx.save();cx.beginPath();cx.rect(528,98,159,312);cx.clip();draw(cx,pose,{t:{ox:607,oy:392,s:.58}});cx.restore();
 cx.fillStyle='#f97316';cx.font='bold 28px sans-serif';cx.textAlign='right';cx.textBaseline='alphabetic';cx.fillText('ポーズ見本',692,82);cx.restore()}

// ---- 状態 ----
let cur=FI[SEQ[0]],term=1,saved=[],touched=[],scores=[],avg=0,drag=null,guide=true,timer=null,playing=false,vIdeal=false,finished=false,refOn=false,warn='',wt=0;
const jj=()=>SV[cur];
const getP=j=>saved[j]||(saved[j]=defaultState(j));
const term1Done=()=>[0,1,2].every(j=>touched[j]);
const allDone=()=>[0,1,2,3,4,5].every(j=>touched[j]);
const accessible=f=>finished||f<=4||term1Done(); // 動画2〜4を描き終えるまで動画6〜8には進めない
const editing=()=>!playing&&!finished&&!vIdeal&&jj()!=null;
const LOCK='動画2〜4を全部描くと、動画6〜8に進めます';
function flash(t){warn=t;updateMsg();clearTimeout(wt);wt=setTimeout(()=>{warn='';updateMsg()},2800)}

// 上のサムネイル：動画⑤→①の向き（歩く向きに合わせて右から左へ時間が進む）
const strip=$('strip'),cells=[];
for(let i=0;i<5;i++){const d=document.createElement('div');d.className='th';d.innerHTML='<div class="tl"></div><canvas width="160" height="200"></canvas>';strip.appendChild(d);
 d.onclick=()=>{const f=d._f;if(!accessible(f)){flash(LOCK);return}go(f)};cells.push(d)}
function renderStrip(){const fr=term==1?[4,3,2,1,0]:[0,7,6,5,4];
 fr.forEach((f,i)=>{const d=cells[i],j=SV[f];d._f=f;d.classList.toggle('cur',f==cur);d.firstChild.textContent='動画'+NAMES[f];
  const c=d.lastChild.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,160,200);
  c.strokeStyle='#b9c2cb';c.lineWidth=2;c.beginPath();c.moveTo(8,192);c.lineTo(152,192);c.stroke();
  c.save();c.translate(80,188);c.scale(.44,.44);c.translate(-HX,-G);
  if(j==null)draw(c,KEY[f?'k2':'k1']);else if(vIdeal)draw(c,IDEAL[j]);else if(touched[j]||finished)puppetFrame(c,j,getP(j)); // まだ作業していない中割りは白いまま
  c.restore()})}

function render(){
 const f=cur,j=SV[f],key=KEY[f?'k2':'k1'];paper(cx);
 if(cur>=1&&cur<=3)term=1;else if(cur>=5)term=2;
 if(j==null)draw(cx,key);
 else if(vIdeal)draw(cx,IDEAL[j]);
 else{
  const ed=editing();
  if(ed&&guide)drawGuides(j);
  puppetFrame(cx,j,getP(j));
  if(finished&&refOn&&!playing)guideDoll(c=>draw(c,IDEAL[j],{part:'lower'}),'#1f9d6b',.6);
  if(ed)drawHandles();
 }
 cx.save();cx.textAlign='left';cx.textBaseline='alphabetic';cx.font='bold 58px sans-serif';cx.fillStyle='#1d2733';
 const lb='動画'+NAMES[f],lw=cx.measureText(lb).width;cx.fillText(lb,14,62);
 if(vIdeal){cx.font='bold 22px sans-serif';cx.fillStyle='#66727f';cx.fillText('見本参考',22+lw,62)}cx.restore();
 if(j!=null&&!playing&&!vIdeal)badge(cx,j,12,76,20);
 if(!playing&&!vIdeal)inset(f);
 renderStrip();updateMsg();updateUI();
}
function updateMsg(){
 const f=cur,j=SV[f];let h='';
 if(playing)h=`${vIdeal?'見本参考':'自分の中割り'}を再生中（24fps・3コマ打ち）`;
 else if(finished){
  h=`<b>完成！</b>　${FNAME(f)}`+(vIdeal?'　見本参考を表示中':refOn&&j!=null?'　緑の人形が見本参考です':'');
 }else if(j==null)h=`${FNAME(f)}は原画なので動かせません。「1枚進む・戻る」で中割りを選ぼう。`;
 else if(guide){
  const gs=GUIDE[j].map(g=>`<i style="background:${gcol(g,j)}"></i>${gname(g)}`).join('');
  h=`<span class="key"><span class="gl">ガイド:</span>${gs}</span>`;
 }else h=`<span class="gl">ガイド: OFF</span>`;
 if(warn)h+=`<br><span class="warn">${warn}</span>`;
 $('msg').innerHTML=h;
}
function updateUI(){
 const n=touched.filter(Boolean).length;
 $('step').textContent=finished?'完成':`ターム${term}（動画${term==1?'2〜4':'6〜8'}）｜描いた ${n}/6`;

function stopPlay(){clearInterval(timer);playing=false}

const playLen=()=>accessible(7)?8:5; // ターム1が終わるまでは 動画①〜⑤ をループ
function startPlay(ideal){stopPlay();vIdeal=ideal;playing=true;if(cur>=playLen())cur=0;render();

// ---- GIFアニメで保存（自分の中割り。24fps・3コマ打ち。下部に日時を入れる）----
let DL=null;
try{if(window.claude&&claude.use)claude.use('downloads').then(d=>{DL=d}).catch(()=>{})}catch(e){}
const GPAL=(()=>{const a=[[255,255,255],[42,42,46],[184,245,72],[255,157,157],[169,230,255],[185,194,203],[102,114,127],[29,39,51]];
 for(let r=0;r<6;r++)for(let g=0;g<6;g++)for(let b=0;b<6;b++)a.push([r*51,g*51,b*51]);
 for(let i=0;a.length<256;i++){const v=Math.round(8+i*7.2);a.push([v,v,v])}return a})();
function gifQuant(rgba,n){const cache=new Map(),idx=new Uint8Array(n);
 for(let i=0;i<n;i++){const o=i*4,r=rgba[o],g=rgba[o+1],b=rgba[o+2],key=r<<16|g<<8|b;let v=cache.get(key);
  if(v===undefined){let best=0,bd=1e9;for(let k=0;k<256;k++){const q=GPAL[k],d=(q[0]-r)**2+(q[1]-g)**2+(q[2]-b)**2;if(d<bd){bd=d;best=k;if(!d)break}}v=best;cache.set(key,v)}
  idx[i]=v}
 return idx}
function lzw(px){const clear=256,eoi=257;let size=9,next=258,tab=new Map(),out=[],acc=0,nb=0;
 const put=c=>{acc|=c<<nb;nb+=size;while(nb>=8){out.push(acc&255);acc>>>=8;nb-=8}};
 put(clear);let cur=px[0];
 for(let i=1;i<px.length;i++){const k=px[i],key=cur<<8|k,v=tab.get(key);
  if(v===undefined){put(cur);
   if(next===4096){put(clear);next=258;size=9;tab.clear()}
   else{if(next>=(1<<size))size++;tab.set(key,next++)}
   cur=k}else cur=v}
 put(cur);put(eoi);if(nb>0)out.push(acc&255);return out}
function gifEncode(frames,w,h,delays){const o=[],b=(...a)=>{for(const x of a)o.push(x)},w2=n=>b(n&255,(n>>8)&255);
 'GIF89a'.split('').forEach(c=>b(c.charCodeAt(0)));w2(w);w2(h);b(0xF7,0,0);
 GPAL.forEach(c=>b(c[0],c[1],c[2]));
 b(0x21,0xFF,0x0B);'NETSCAPE2.0'.split('').forEach(c=>b(c.charCodeAt(0)));b(3,1,0,0,0);
 frames.forEach((px,i)=>{b(0x21,0xF9,4,0x04);w2(delays[i]);b(0,0);
  b(0x2C,0,0,0,0);w2(w);w2(h);b(0,8);
  const d=lzw(px);for(let p=0;p<d.length;p+=255){const n=Math.min(255,d.length-p);o.push(n);for(let q=0;q<n;q++)o.push(d[p+q])}
  o.push(0)});
 b(0x3B);return new Uint8Array(o)}
let gifUrl=null;
async function saveOutside(blob,name){
 if(gifUrl)URL.revokeObjectURL(gifUrl);gifUrl=URL.createObjectURL(blob);
 $('gpi').src=gifUrl;$('gp').hidden=false; // 保存されないときは、この画像を長押しして保存できる
 try{ // スマホ：共有メニューから「画像を保存」などを選べる
  const file=new File([blob],name,{type:'image/gif'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});flash('GIFアニメを共有メニューに渡しました');return}
 }catch(e){if(e&&e.name==='AbortError')return}
 const a=document.createElement('a');a.href=gifUrl;a.download=name;document.body.appendChild(a);a.click();a.remove(); // パソコン：ふつうのダウンロード
 flash('GIFアニメを保存しました。保存されないときは、下の画像を長押し（右クリック）して保存してください');
}
async function saveGif(){
 if(!finished)return;
  stopPlay();const btn=$('gif'),old=btn.textContent;btn.disabled=true;btn.textContent='作成中…';
 try{
  await new Promise(r=>setTimeout(r,30));
  const EW=540,EH=390,src=document.createElement('canvas');src.width=W;src.height=H;const sx=src.getContext('2d');
  const ex=document.createElement('canvas');ex.width=EW;ex.height=EH;const ec=ex.getContext('2d');
  const d=new Date(),p2=n=>String(n).padStart(2,'0'),stamp=`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  const fr=[],dl=[];

   const j=SV[f];paper(sx);if(j==null)draw(sx,KEY[f?'k2':'k1']);else puppetFrame(sx,j,getP(j));
   ec.fillStyle='#fff';ec.fillRect(0,0,EW,EH);ec.drawImage(src,0,0,W,H,0,0,EW,EW*H/W);

   fr.push(gifQuant(ec.getImageData(0,0,EW,EH).data,EW*EH));dl.push(f%2?12:13); // 3/24秒 = 12.5cs → 13と12を交互に
  }

}
